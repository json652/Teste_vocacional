<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de talentos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="Estilo2.css" />
  </head>
  <body class="bg-primary m-0">
    <header class="d-flex justify-content-center align-items-center">
      <h1 class="h1">Mapa de talentos!</h1>
    </header>

    <h3 class="h3 d-flex justify-content-center align-items-center">
      Para cada afirmação, atribua uma nota de 1 a 5, conforme o quanto ela
      combina com você:
    </h3>
    <!--Container principal-->
    <main class="container py-5">
      <!--Card onde o questionário vai aparecer-->
      <div class="card shadow-sm">
        <!--Conteúdo do card-->
        <div class="card-body p-4">
          <!--FORMULÁRIO-->
          <form id="formularioTeste">
            <!--Barra de progresso-->
            <div
              class="progress mb-3"
              id="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
            ></div>
            <!--Contador de perguntas-->
            <p id="counter" class="text-muted small mb-2"></p>
            <!--Pergunta-->
            <h2 id="question-text" class="h4 mb-4"></h2>
            <!--Resposta do candidato/aluno-->
            <div id="answers" class="d-grid gap-2 mb-3">
              <div>
                <button
                  type="button"
                  class="btn btn-light"
                  onclick="FormSubmit()"
                  id="1"
                >
                  1
                </button>
                <button
                  type="button"
                  class="btn btn-light"
                  onclick="FormSubmit()"
                  id="2"
                >
                  2
                </button>
                <button
                  type="button"
                  class="btn btn-light"
                  onclick="FormSubmit()"
                  id="3"
                >
                  3
                </button>
                <button
                  type="button"
                  class="btn btn-light"
                  onclick="FormSubmit()"
                  id="4"
                >
                  4
                </button>
                <button
                  type="button"
                  class="btn btn-light"
                  onclick="FormSubmit()"
                  id="5"
                >
                  5
                </button>
              </div>
            </div>
          </form>
          <!--Botão para voltar-->
          <button id="back" class="btn btn-link p-0">Back</button>
        </div>
      </div>
    </main>
  </body>
</html>
